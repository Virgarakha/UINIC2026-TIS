<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 88" width="44" height="88">
  <defs>
    <!-- Soft shadow filter -->
    <filter id="vehicle-shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ca18b"/>
      <stop offset="50%" stop-color="#0EB29A"/>
      <stop offset="100%" stop-color="#0ca18b"/>
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B3752"/>
      <stop offset="100%" stop-color="#1e273b"/>
    </linearGradient>
  </defs>

  <!-- Shadow Group -->
  <g filter="url(#vehicle-shadow)">
    <!-- Rear Tire -->
    <rect x="18" y="68" width="8" height="16" rx="4" fill="#0f172a" />
    <line x1="22" y1="70" x2="22" y2="82" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- Front Tire -->
    <rect x="18" y="2" width="8" height="16" rx="4" fill="#0f172a" />
    <line x1="22" y1="4" x2="22" y2="16" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- Front Mudguard -->
    <path d="M 19 6 Q 22 2 25 6 L 25 15 L 19 15 Z" fill="#0EB29A" />

    <!-- Handlebars and Grips -->
    <rect x="6" y="16" width="32" height="3.5" rx="1.75" fill="#334155" />
    <!-- Left Grip -->
    <rect x="5" y="15" width="4" height="5.5" rx="1.5" fill="#0f172a" />
    <!-- Right Grip -->
    <rect x="35" y="15" width="4" height="5.5" rx="1.5" fill="#0f172a" />
    <!-- Mirrors -->
    <circle cx="7" cy="12" r="2.2" fill="#94a3b8" stroke="#334155" stroke-width="1" />
    <circle cx="37" cy="12" r="2.2" fill="#94a3b8" stroke="#334155" stroke-width="1" />

    <!-- Front Cowl & Headlight -->
    <path d="M 16 18 Q 22 13 28 18 L 26 25 L 18 25 Z" fill="url(#body-grad)" />
    <path d="M 18 16 Q 22 13 26 16 L 25 19 L 19 19 Z" fill="#fef08a" opacity="0.95" />

    <!-- Fuel Tank / Front Chassis -->
    <path d="M 17 25 Q 15 32 17 38 L 27 38 Q 29 32 27 25 Z" fill="url(#body-grad)" />
    <ellipse cx="22" cy="30" rx="2.5" ry="3.5" fill="#065f46" opacity="0.4" />

    <!-- Driver Shoulders & Helmet (Top-Down view of courier) -->
    <path d="M 11 39 C 11 34, 33 34, 33 39 L 32 46 C 32 47, 12 47, 12 46 Z" fill="#2E6E65" />
    <!-- Helmet -->
    <circle cx="22" cy="40" r="7" fill="#0EB29A" stroke="#065f46" stroke-width="1.2" />
    <!-- Helmet Visor -->
    <path d="M 17 37 Q 22 34 27 37" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Driver Seat -->
    <path d="M 16 46 L 28 46 L 27 54 L 17 54 Z" fill="#1e293b" />

    <!-- Carrier Rack / Rear Cargo Collection Box (Bak Pengangkut Sampah Ringan) -->
    <rect x="9" y="52" width="26" height="22" rx="3.5" fill="url(#box-grad)" stroke="#0EB29A" stroke-width="1.2" />
    <!-- Eco Trash Box Lid / Texture -->
    <line x1="12" y1="56" x2="32" y2="56" stroke="#475569" stroke-width="1" />
    <!-- Eco Icon / Emblem on top of Box -->
    <circle cx="22" cy="63" r="4.5" fill="#0EB29A" />
    <path d="M 22 60.5 L 23.5 63 L 20.5 63 Z" fill="#ffffff" />
    <circle cx="22" cy="63" r="3" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="2 1" />

    <!-- Taillight -->
    <rect x="18" y="74" width="8" height="2.5" rx="1.2" fill="#ef4444" />
  </g>
</svg>
